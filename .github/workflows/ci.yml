name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ShellCheck, build, and E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 26.4.0
        uses: actions/setup-node@v6
        with:
          node-version: 26.4.0
          cache: npm

      - name: Install ShellCheck and SQLite
        run: sudo apt-get update && sudo apt-get install -y shellcheck sqlite3

      - name: Install npm dependencies with clean lockfile
        run: npm ci

      - name: Run ShellCheck
        run: npm run shellcheck

      - name: Build TypeScript plugin
        run: npm run build

      - name: Run end-to-end CLI and plugin tests
        run: npm test
